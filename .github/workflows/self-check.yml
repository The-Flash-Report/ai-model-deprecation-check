name: Self Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit and CLI tests
        run: npm test

      - name: Run action against repository source
        uses: ./
        with:
          paths: "scripts/**,LICENSE,.github/**"
